<!DOCTYPE html>
<html>
<head>

    <title>Patient Registration</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav>

       <h2>🏥 Nagapamu Hospital</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>

    </nav>


    <div class="form-container">

        <h2>Patient Registration</h2>

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="number"
                id="age"
                placeholder="Age"
                required
            >


            <select id="gender" required>

                <option value="">Select Gender</option>

                <option value="Male">Male</option>

                <option value="Female">Female</option>

                <option value="Other">Other</option>

            </select>


            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >


            <input
                type="text"
                id="mobile"
                placeholder="Mobile Number"
                required
            >


            <input
                type="text"
                id="address"
                placeholder="Address"
                required
            >


            <select id="bloodGroup" required>

                <option value="">Select Blood Group</option>

                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>

            </select>


            <input
                type="text"
                id="problem"
                placeholder="Health Problem"
                required
            >


            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <button type="submit">
                Register
            </button>

        </form>


        <p id="message"></p>


        <p>
            Already registered?
            <a href="login.html">Login Here</a>
        </p>

    </div>


    <script src="js/script.js"></script>

</body>
</html>
