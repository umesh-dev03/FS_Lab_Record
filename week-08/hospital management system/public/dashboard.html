<!DOCTYPE html>
<html>
<head>

    <title>Patient Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <nav>

        <h2>🏥 Nagapamu Hospital</h2>
        <button onclick="logout()" class="logout-btn">
            Logout
        </button>

    </nav>


    <div class="dashboard">

        <h1>Welcome to Your Dashboard</h1>

        <div class="patient-card">

            <h2>Patient Information</h2>

            <p><strong>Name:</strong> <span id="patientName"></span></p>

            <p><strong>Age:</strong> <span id="patientAge"></span></p>

            <p><strong>Gender:</strong> <span id="patientGender"></span></p>

            <p><strong>Email:</strong> <span id="patientEmail"></span></p>

            <p><strong>Mobile:</strong> <span id="patientMobile"></span></p>

            <p><strong>Blood Group:</strong> <span id="patientBlood"></span></p>

            <p><strong>Health Problem:</strong> <span id="patientProblem"></span></p>

        </div>


        <div class="services-dashboard">

            <h2>Hospital Services</h2>

            <div class="service-container">

                <div class="card">

                    <h3>👨‍⚕️ Doctors</h3>

                    <p>Consult experienced doctors.</p>

                </div>


                <div class="card">

                    <h3>🚑 Emergency</h3>

                    <p>24/7 emergency services.</p>

                </div>


                <div class="card">

                    <h3>💊 Pharmacy</h3>

                    <p>Get medicines easily.</p>

                </div>

            </div>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>
</html>
